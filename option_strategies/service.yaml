# Cloud Run service manifest.
#
# Deploy manually:
#   gcloud run services replace service.yaml --region=us-central1
#
# Or let cloudbuild.yaml handle it automatically on push.
#
# NOTE: Update the image path below with your actual project ID and region
# before first deploy. Cloud Build substitutes $PROJECT_ID automatically
# but `gcloud run services replace` does not.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wheel-dashboard
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/PROJECT_ID/wheel-repo/wheel-dashboard:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
